name: CI/CD Workflow

on:
  workflow_call:
    inputs:
      github_actor:
        required: true
        type: string

      # Build args
      custom_tag_name:
        required: false
        type: string
      image_name:
        required: false
        type: string
      subdirectory:
        required: false
        type: string
        default: ""
      dockerfile_name:
        required: false
        type: string
        default: Dockerfile
      build_args:
        required: false
        type: string
        # default: |
        #   _ENV=development

      # Deploy args
      deploy_folder_path:
        required: true
        type: string
      deploy_command:
        required: true
        type: string

      # Notify args
      discord_enable:
        required: false
        type: string
        default: true
      stela_enable:
        required: false
        type: string
        default: "false"
      ssh_enable:
        required: false
        type: string
        default: true
      double_ssh_enable:
        required: false
        type: string
        default: false

    secrets:
      git_token:
        required: true
      ssh_private_key:
        required: true
      discord_webhook_id:
        required: true
      discord_webhook_token:
        required: true
      stela_webhook_id:
        required: false
      stela_webhook_token:
        required: false
      # Deploy args

      ssh_host:
        required: true
      ssh_user:
        required: true
      ssh_port:
        required: true
      ssh_host2:
        required: false
      ssh_user2:
        required: false
      ssh_port2:
        required: false

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ inputs.github_actor }}
          password: ${{ secrets.git_token }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ inputs.subdirectory }}
          file: ${{ inputs.dockerfile_name }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ inputs.subdirectory != '' && inputs.subdirectory || github.event.repository.name }}:${{ inputs.custom_tag_name != '' && inputs.custom_tag_name || github.ref_name }}
            ${{ github.ref_type == 'tag' && format('ghcr.io/{0}:latest', github.repository) || '' }}
            ${{ github.ref_name == 'main' && format('ghcr.io/{0}:main', github.repository) || github.ref_name == 'dev' && format('ghcr.io/{0}:dev', github.repository) || github.ref_name == 'demo' && format('ghcr.io/{0}:demo', github.repository) || '' }}
            ${{ inputs.image_name }}
          build-args: |
            # ${{ inputs.build_args != '' && inputs.build_args || (github.ref_type == 'tag' && '_ENV=production') || '_ENV=development' }}
            # ${{ inputs.build_args != '' && inputs.build_args || github.ref_type == 'tag' && '_ENV=production' || github.ref_name == 'main' && '_ENV=production' || github.ref_name == 'demo' && '_ENV=demo' || github.ref_name == 'dev' && '_ENV=development' || '_ENV=development' }}
            ${{ inputs.build_args != '' && inputs.build_args || github.ref_type == 'tag' && '_ENV=production' || github.ref_name == 'main' && '_ENV=production' || github.ref_name == 'demo' && '_ENV=demo' || github.ref_name == 'dev' && '_ENV=development' || format('_ENV={0}', github.ref_name) }}
            GIT_TOKEN=${{ secrets.git_token }}

  deploy:
    needs: docker-build
    runs-on: ubuntu-latest
    if: ${{ inputs.ssh_enable == 'true' }}
    steps:
      - name: Decode SSH Key
        shell: bash
        run: |
          echo "${{ secrets.ssh_private_key }}" | base64 -d > private_key.pem
          echo "PRIVATE_KEY_PATH=private_key.pem" >> $GITHUB_ENV
      - name: Deploy Application
        if: ${{ inputs.double_ssh_enable != 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ssh_host }}
          username: ${{ secrets.ssh_user }}
          key_path: ${{ env.PRIVATE_KEY_PATH }}
          port: ${{ secrets.ssh_port }}
          script: |
            repo_name=$(echo "${{ github.event.repository.name }}" | tr -d '_-')
            cd ${{ inputs.deploy_folder_path }}
            sh ${{ inputs.deploy_command }} $repo_name
      - name: Double SSH Deploy
        if: ${{ inputs.double_ssh_enable == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ssh_host }}
          username: ${{ secrets.ssh_user }}
          key_path: ${{ env.PRIVATE_KEY_PATH }}
          port: ${{ secrets.ssh_port }}
          script: |
            repo_name=$(echo "${{ github.event.repository.name }}" | tr -d '_-')
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -p ${{ secrets.ssh_port2 }} ${{ secrets.ssh_user2 }}@${{ secrets.ssh_host2 }} \
              "whoami && cd ${{ inputs.deploy_folder_path }} && sh ${{ inputs.deploy_command }} $repo_name"

            
  notify-discord:
    needs: [docker-build, deploy]
    runs-on: ubuntu-latest
    if: always()  # 💡 Always run notify, regardless of previous jobs' result
    steps:
      - name: Send Success Notification to Discord
        if: ${{ needs.docker-build.result == 'success' && needs.deploy.result == 'success' }}
        uses: appleboy/discord-action@master
        with:
          webhook_id: ${{ secrets.discord_webhook_id }}
          webhook_token: ${{ secrets.discord_webhook_token }}
          username: ${{ github.event.sender.login }}
          avatar_url: ${{ github.event.sender.avatar_url }}
          args: |
            ✅ **Successfully Deployed:** ${{ github.event.repository.name }}
            🔹 **Branch:** `${{ github.ref_name }}`
            **Commit:** `${{ github.event.head_commit.message }}`

      - name: Send Failure Notification to Discord
        if: ${{ needs.docker-build.result != 'success' || needs.deploy.result != 'success' }}
        uses: appleboy/discord-action@master
        with:
          webhook_id: ${{ secrets.discord_webhook_id }}
          webhook_token: ${{ secrets.discord_webhook_token }}
          username: ${{ github.event.sender.login }}
          avatar_url: ${{ github.event.sender.avatar_url }}
          args: |
            🔴 **Failed Deployment:** ${{ github.event.repository.name }}
            ❌ **Branch:** `${{ github.ref_name }}`
               **Commit:** `${{ github.event.head_commit.message }}`
            ❌ **URL:** [View Workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

  notify-stela:
    needs: [docker-build, deploy]
    runs-on: ubuntu-latest
    if: ${{ always() && inputs.stela_enable == 'true' }}  # 💡 Always run notify, regardless of previous jobs' result
    steps:
      - name: Send Success Notification to Stela
        if: ${{ needs.docker-build.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
        uses: devopsprabin/stela-action@v1
        with:
          webhook_id: ${{ secrets.stela_webhook_id }}
          webhook_token: ${{ secrets.stela_webhook_token }}
          status: success
          actor_name: ${{ github.event.sender.login }}
          actor_avatar_url: ${{ github.event.sender.avatar_url }}
          title: "Successfully Deployed: ${{ github.event.repository.name }}"
          description: |
            🔹 Branch: ${{ github.ref_name }}
            Commit: ${{ github.event.head_commit.message }}
            SHA: {{truncate commit.sha 7}}

      # Build broke: the code or Dockerfile needs a fix, nothing was deployed.
      - name: Send Docker Build Failure Notification to Stela
        if: ${{ needs.docker-build.result != 'success' }}
        uses: devopsprabin/stela-action@v1
        with:
          webhook_id: ${{ secrets.stela_webhook_id }}
          webhook_token: ${{ secrets.stela_webhook_token }}
          status: failure
          actor_name: ${{ github.event.sender.login }}
          actor_avatar_url: ${{ github.event.sender.avatar_url }}
          title: "Docker Build Failed: ${{ github.event.repository.name }}"
          description: |
            ❌ Branch: ${{ github.ref_name }}
            Commit: ${{ github.event.head_commit.message }}
            @${{ github.event.sender.login }}, the Docker image failed to build, so nothing was deployed.
            Please open the workflow logs, fix the build error in your code or Dockerfile, and push again.
          source_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # Build passed but deploy broke: the server may need a manual deploy.
      - name: Send Deploy Failure Notification to Stela
        if: ${{ needs.docker-build.result == 'success' && (needs.deploy.result == 'failure' || needs.deploy.result == 'cancelled') }}
        uses: devopsprabin/stela-action@v1
        with:
          webhook_id: ${{ secrets.stela_webhook_id }}
          webhook_token: ${{ secrets.stela_webhook_token }}
          status: failure
          actor_name: ${{ github.event.sender.login }}
          actor_avatar_url: ${{ github.event.sender.avatar_url }}
          title: "Deployment Failed: ${{ github.event.repository.name }}"
          description: |
            ❌ Branch: ${{ github.ref_name }}
            Commit: ${{ github.event.head_commit.message }}
            @${{ github.event.sender.login }}, the Docker image built successfully but the deployment failed.
            Please deploy it manually yourself, or ask a senior developer for help if you don't have server access.
          source_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
